name: Deploy React app to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Install Chromium for screenshot capture
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start local preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/neon-guesser-preview.log 2>&1 &
          echo $! > /tmp/neon-guesser-preview.pid

      - name: Wait for preview server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173 > /dev/null
          sleep 5

      - name: Capture 1024x720 screenshot
        run: |
          mkdir -p screenshots
          npx --yes playwright@1.55.0 screenshot \
            --viewport-size="1024,720" \
            http://127.0.0.1:5173 \
            screenshots/image.png

      - name: Commit screenshot without triggering another workflow
        run: |
          if [ -z "$(git status --porcelain -- screenshots/image.png)" ]; then
            echo "Screenshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/image.png
          git commit -m "chore: update generated screenshot [skip ci]"
          git push

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
